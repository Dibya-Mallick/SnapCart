# Render Blueprint: deploys the API (with its MCP endpoint) and the Next.js storefront.
# After the first deploy, set the URL variables marked `sync: false` to each
# service's onrender.com address, and add your Groq and PayPal sandbox keys.
services:
  - type: web
    name: snapcart-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: groq
      - key: VISION_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # e.g. https://snapcart-web.onrender.com
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: snapcart-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # e.g. https://snapcart-api.onrender.com (read at build time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
